<div class="container mx-auto px-4 py-8">
  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-8">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#f85a00]"></div>
    <p class="mt-2 text-gray-600">Loading all car brands...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="text-center py-8">
    <p class="text-red-600">{{ error }}</p>
    <button (click)="loadAllBrands()" class="mt-4 px-4 py-2 bg-[#f85a00] text-white rounded">
      Retry
    </button>
  </div>

  <!-- Content -->
  <div *ngIf="!loading && !error">
    <h2 class="text-2xl font-bold text-center mb-8">Tüm Araç Markaları</h2>
    <div class="alphabet-bar flex flex-wrap justify-center mb-8 bg-white border border-gray-200 rounded-lg overflow-hidden px-2 py-2">
      <span 
        class="alphabet-tab"
        [ngClass]="{ 'active': selectedLetter === 'ALL' }"
        (click)="selectLetter('ALL')">All</span>
      <span 
        *ngFor="let letter of alphabet"
        class="alphabet-tab"
        [ngClass]="{ 'active': selectedLetter === letter }"
        (click)="selectLetter(letter)">{{letter}}</span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <div 
        *ngFor="let brand of filteredBrands" 
        class="brand-card bg-white rounded-lg p-4 flex flex-col items-center justify-center cursor-pointer hover:shadow-lg transition-shadow"
        (click)="goToBrandModels(brand)">
        <img [src]="brand.imageURL" [alt]="brand.name" class="brand-logo h-16 object-contain mb-2">
        <span class="text-gray-800 font-medium text-center">{{brand.name}}</span>
      </div>
    </div>
  </div>
</div>
